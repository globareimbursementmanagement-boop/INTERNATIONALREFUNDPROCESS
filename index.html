<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Refund - Hamburg & World Bank</title>
    <style>
        :root {
            --hamburg-red: #E10019;
            --hamburg-blue: #003063;
        }
        
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            /* HD Hamburg City Background */
            background: linear-gradient(rgba(0, 48, 99, 0.6), rgba(0, 48, 99, 0.6)), 
                        url('https://pexels.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 40px 20px; 
            color: #333;
            min-height: 100vh;
            margin: 0;
        }

        .lang-bar { width: 100%; max-width: 750px; text-align: right; margin-bottom: 15px; }
        .lang-bar select { padding: 8px 15px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .form-container { 
            background: rgba(255, 255, 255, 0.97); 
            backdrop-filter: blur(8px);
            width: 100%; 
            max-width: 750px; 
            border-radius: 8px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            overflow: hidden; 
            border-top: 10px solid var(--hamburg-red);
        }
        
        .header { padding: 40px 30px; text-align: center; background: white; border-bottom: 5px solid var(--hamburg-blue); }
        .header h1 { color: var(--hamburg-blue); margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .header p { margin: 10px 0 0; color: var(--hamburg-red); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        
        .section-box { padding: 40px; display: none; }
        .section-box.active { display: block; }
        
        h2 { font-size: 17px; color: var(--hamburg-blue); margin-bottom: 25px; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 11px; color: var(--hamburg-blue); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; box-sizing: border-box; }
        input.error { border: 2px solid var(--hamburg-red); background-color: #fffafa; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 40px; }
        button { background-color: var(--hamburg-blue); color: white; border: none; padding: 16px 45px; cursor: pointer; font-size: 13px; font-weight: 800; text-transform: uppercase; border-radius: 4px; transition: 0.3s; }
        button:hover { background-color: var(--hamburg-red); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        #loader { display: none; border: 5px solid #f3f3f3; border-top: 5px solid var(--hamburg-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer { font-size: 10px; color: #777; text-align: center; padding: 25px; background: rgba(255,255,255,0.9); border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="lang-bar">
        <select>
            <option>🌐 English (International)</option>
            <option>🇩🇪 Deutsch (Hamburg Office)</option>
        </select>
    </div>

    <div class="form-container">
        <form id="refundForm" onsubmit="return false;">
            <div class="header">
                <h1>FREIE UND HANSESTADT HAMBURG</h1>
                <p>World Bank Partnership • Global Portal</p>
            </div>

            <!-- SECTION 1 -->
            <div id="section1" class="section-box active">
                <h2>Section 1: Identity & Nationality</h2>
                <div class="input-group">
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px;">
                        <div><label>Last Name *</label><input type="text" class="required"></div>
                        <div><label>First Name *</label><input type="text" class="required"></div>
                        <div><label>Middle Name *</label><input type="text" class="required"></div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="input-group"><label>Email *</label><input type="email" class="required"></div>
                    <div class="input-group"><label>Nationality *</label><input type="text" class="required"></div>
                </div>

                <div class="input-group"><label>Residential Address *</label><input type="text" class="required"></div>

                <div class="grid-2">
                    <div class="input-group"><label>Birthdate *</label><input type="date" class="required"></div>
                    <div class="input-group"><label>Contact Number *</label><input type="text" class="required"></div>
                </div>

                <div class="input-group"><label>Upload Valid ID *</label><input type="file" class="required"></div>

                <div class="btn-container">
                    <span></span>
                    <button type="button" onclick="validateAndNext()">Continue</button>
                </div>
            </div>

            <!-- SECTION 2 -->
            <div id="section2" class="section-box">
                <h2>Section 2: Claim & Disbursement</h2>
                <div class="grid-2">
                    <div class="input-group"><label>Amount (EUR) *</label><input type="number" class="required"></div>
                    <div class="input-group"><label>Upload Receipt *</label><input type="file" class="required"></div>
                </div>
                <div class="input-group"><label>Bank Name *</label><input type="text" class="required"></div>
                <div class="grid-2">
                    <div class="input-group"><label>Account / IBAN *</label><input type="text" class="required"></div>
                    <div class="input-group"><label>Card Type *</label><select class="required"><option value="">Select...</option><option>Debit</option><option>Credit</option></select></div>
                </div>
                <div id="loader"></div>
                <div class="btn-container">
                    <button type="button" onclick="prevSection()" style="background:#666">Back</button>
                    <button type="button" id="submitBtn" onclick="validateAndSubmit()">Submit Claim</button>
                </div>
            </div>
        </form>
        <div class="footer">© 2024 Behörde für Finanzen • Hamburg | Strategic Partner of World Bank Group</div>
    </div>

<script>
    function validateAndNext() {
        let inputs = document.querySelectorAll('#section1 .required');
        let valid = true;
        inputs.forEach(i => { i.classList.remove('error'); if(!i.value) { i.classList.add('error'); valid = false; } });
        if(valid) { document.getElementById('section1').classList.remove('active'); document.getElementById('section2').classList.add('active'); window.scrollTo(0,0); }
    }
    function validateAndSubmit() {
        let inputs = document.querySelectorAll('#section2 .required');
        let valid = true;
        inputs.forEach(i => { i.classList.remove('error'); if(!i.value) { i.classList.add('error'); valid = false; } });
        if(valid) {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            setTimeout(() => { alert('SUCCESS: Your international refund claim has been submitted to the World Bank processing unit.'); location.reload(); }, 3000);
        }
    }
    function prevSection() { document.getElementById('section2').classList.remove('active'); document.getElementById('section1').classList.add('active'); }
</script>
</body>
</html>
